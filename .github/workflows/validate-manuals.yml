name: validate-manuals

on:
  push:
    paths:
      - "**/*.pdf"
      - "**/*.md"
      - "**/manifest.yaml"
      - "tools/**"
      - ".github/workflows/validate-manuals.yml"
  pull_request:
    paths:
      - "**/*.pdf"
      - "**/*.md"
      - "**/manifest.yaml"
      - "tools/**"
      - ".github/workflows/validate-manuals.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate PDF/markdown pairs
        run: python tools/validate.py
